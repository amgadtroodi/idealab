:root{--navy:#142e43;--teal:#087f80;--mint:#b7eee3;--ink:#183043;--muted:#617686;--line:#dce5e8;--bg:#f3f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;line-height:1.65}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 16px;font-weight:700;background:#e7eff1;color:var(--ink)}button.primary{background:var(--teal);color:white}button:disabled{opacity:.5;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(.95)}a{color:var(--teal)}header{background:var(--navy);color:white;padding:22px max(24px,calc((100vw - 1260px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font-size:27px;letter-spacing:1px;color:var(--mint)}header small{display:block;color:#c4d6e0}header button{background:#29475a;color:white}.layout{max-width:1260px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:265px minmax(0,1fr);gap:24px}aside{align-self:start;position:sticky;top:16px}aside,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:23px}.progress{height:8px;background:#e5edef;border-radius:20px;overflow:hidden}.progress div{height:100%;background:var(--teal);transition:width .2s}nav{margin-top:18px;display:grid;gap:5px}nav button{display:flex;align-items:center;text-align:right;gap:9px;background:white;padding:9px;font-size:14px;font-weight:500}nav button.active{background:#e0f2ef;color:#066764;font-weight:700}nav .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#edf2f3;flex-shrink:0}nav .complete{background:#d0eee2;color:#086947}.kicker{color:var(--teal);font-size:13px;font-weight:bold;letter-spacing:.4px}h1{font-size:32px;line-height:1.25;margin:8px 0}h2{font-size:21px;margin:10px 0}p{margin:8px 0 15px}.muted{color:var(--muted);font-size:14px}.example{background:#edf6f5;border-right:4px solid var(--teal);padding:15px 18px;border-radius:8px;margin:20px 0}.example p{margin:5px 0}.fields{display:grid;gap:16px}label{display:block;font-weight:700;margin-bottom:5px}textarea,input{width:100%;border:1px solid #c8d5dc;border-radius:9px;background:white;padding:11px;color:var(--ink)}textarea{min-height:85px;resize:vertical}textarea:focus,input:focus{outline:2px solid #65b7ad;outline-offset:1px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.sub{border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.tag{display:inline-block;border-radius:20px;background:#eef3f4;padding:4px 12px;font-size:13px}.identity{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:flex-start;gap:9px;font-weight:400;margin:10px 0}.check input{width:auto;margin-top:7px}.status{font-size:13px;color:var(--muted)}footer{text-align:center;padding:20px;color:var(--muted);font-size:13px}#toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:white;padding:12px 20px;border-radius:8px;display:none;z-index:5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;background:#f4f7f8;padding:18px;border-radius:9px}.notice{background:#fff7e7;padding:12px;border-radius:8px}.stephead{display:flex;align-items:center;justify-content:space-between;gap:10px}.help{font-size:14px;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr;margin:12px auto;padding:0 10px;gap:12px}aside{position:static}nav{grid-template-columns:repeat(2,minmax(0,1fr))}.panel,aside{padding:16px}h1{font-size:26px}header{padding:15px}.identity{grid-template-columns:1fr}}@media print{header,aside,.actions,footer,#toast{display:none}.layout{display:block;margin:0;padding:0}.panel{border:0}body{background:white}}
</style></head><body><header><div><strong dir="ltr">IdeaLab.</strong><small>מרעיון לאבטיפוס · סדנת יזמות בחינוך</small></div><button id="home">דף פתיחה</button></header><div class="layout"><aside><b>מסלול העבודה שלי</b><div id="progressText" class="muted"></div><div class="progress"><div id="bar"></div></div><nav id="nav"></nav><div class="sub"><button id="summary" style="width:100%">ספר האפיון והגשה</button></div><p class="status" id="saveStatus">הנתונים נשמרים בדפדפן זה</p></aside><main class="panel" id="main"></main></div><footer>IdeaLab · סביבת למידה עצמאית · ללא חיבור API או איסוף מרכזי של נתונים</footer><div id="toast" role="status"></div><script>
const stages=[{"title": "הבעיה והערך", "intro": "מי חווה את הבעיה, ומתי?", "example": "הורה עלול להחמיץ מצוקה חברתית שאינה מדווחת. הערך המוצע הוא סיוע בפתיחת שיחה.", "questions": ["שם המיזם", "מי חווה את הבעיה? תארו רגע ממשי", "מה קורה היום ומה קשה בו?", "מה ישתפר עבור המשתמש?"], "prompt": "עזור לי לנסח בעיה וערך בלי להניח מראש שהפתרון הוא אפליקציה. שאל אותי שאלות לפני הצעת ניסוח."}, {"title": "אימות הצורך", "intro": "האם הבעיה באמת מצדיקה פתרון?", "example": "הצורך משמעותי, אך אימוץ הצמיד ותרומתו עדיין דורשים אימות.", "questions": ["היקף ותדירות: מי וכמה פעמים?", "השלכות: מה המחיר של הבעיה?", "חלופות ובידול: מה קיים ומה חסר?", "בעלי עניין ונכונות לפעול: מי יסכים להשתמש?", "היתכנות: מה עדיין לא ידוע?", "כתבו שתי שאלות פתוחות לראיון ותוכנית בדיקה"], "prompt": "בחן את ההנחות שלי לפי היקף, תדירות, השלכות, חלופות, בידול, אימוץ, דחיפות והיתכנות. הפרד ראיות מהשערות ואל תמציא נתונים."}, {"title": "משתמשים ובעלי עניין", "intro": "למי אנחנו בונים?", "example": "הורה הוא משתמש עיקרי; ילד הוא משתמש משני; בית הספר בעל עניין.", "questions": ["משתמש עיקרי ומה הוא צריך", "משתמש נוסף ומה הוא צריך", "מי מאשר, מושפע או עלול להתנגד?", "מה יעזור לכל אחד להרגיש בטוח?"], "prompt": "הצע מפת משתמשים ובעלי עניין על בסיס התשובות שלי. הצג צרכים שונים ושאלות שטרם נבדקו."}, {"title": "דרישות המוצר", "intro": "מה המשתמש צריך להיות מסוגל לעשות?", "example": "כהורה אני רוצה לפתוח אירוע בציר הזמן. הצלחה: הפרטים נפתחים ואפשר לחזור לרשימה.", "questions": ["סיפור משתמש ראשון: בתור ___ אני רוצה ___ כדי ___", "איך אדע שהפעולה הראשונה הצליחה?", "סיפור משתמש שני וקריטריון הצלחה", "סיפור משתמש שלישי וקריטריון הצלחה"], "prompt": "הפוך את הצרכים שלי לשלושה סיפורי משתמש וקריטריוני קבלה שניתן לבדוק. אל תוסיף יכולות בלי אישורי."}, {"title": "גבולות הגרסה הראשונה", "intro": "מה נבנה עכשיו ומה יחכה?", "example": "בהדגמה: ציר זמן, סנכרון ואירועים מדומים. לא עכשיו: צמיד אמיתי או גישה להודעות.", "questions": ["שלוש יכולות שחייבות להיות בהדגמה", "שתי יכולות שנדחה להמשך", "מה נדמה במקום לחבר מערכת אמיתית?", "מה נרצה ללמוד מהאבטיפוס?"], "prompt": "עזור לי לצמצם את הגרסה הראשונה לפעולה בעלת ערך. הפרד בין חובה, רצוי ומחוץ לתכולה."}, {"title": "זרימת המשתמש", "intro": "מה קורה מרגע הכניסה ועד השגת המטרה?", "example": "כניסה להדגמה, לוח בקרה, ציר זמן, פרטי אירוע, המלצה לשיחה.", "questions": ["מה נקודת הכניסה ומה המטרה?", "שלב ראשון: פעולה ותוצאה", "שלב שני: פעולה ותוצאה", "שלב שלישי: פעולה ותוצאה", "איך חוזרים אחורה או מתאוששים מכשל?"], "prompt": "צור זרימת משתמש עם חצים, פעולות, החלטות ודרך חזרה. השתמש רק בדרישות שאישרתי."}, {"title": "אפיון המסכים", "intro": "מה רואים ומה אפשר לעשות בכל מסך?", "example": "לוח בקרה מציג סיכום; ציר זמן מציג אירועים; פרטי אירוע מציגים הסבר.", "questions": ["מסך ראשון: שם, מידע, כפתור ויעד הלחיצה", "מסך שני: שם, מידע, כפתור ויעד הלחיצה", "מסך שלישי: שם, מידע, כפתור ויעד הלחיצה", "מסך נוסף או מצב ריק / שגיאה", "סגנון, שפה ונגישות"], "prompt": "הצע מפרט מסכים לפי הזרימה שלי. לכל מסך ציין מטרה, תוכן, כפתורים, יעדי ניווט ומצבי ריק ושגיאה."}, {"title": "המידע וקשריו", "intro": "איזה מידע האפליקציה צריכה לזכור?", "example": "לילד אחד יכולים להיות אירועים רבים. לכל אירוע סוג, מועד ותיאור.", "questions": ["קבוצת מידע ראשונה: שם ושדות", "קבוצת מידע שנייה: שם ושדות", "קבוצת מידע שלישית: שם ושדות", "איזה מידע קשור לאיזה מידע? אחד או רבים?", "איזה מידע רגיש לא צריך לאסוף?"], "prompt": "בנה מילון מידע פשוט: קבוצות, שדות, סוגים (טקסט, מספר, תאריך, כן או לא), מזהים וקשרים. הצג תרשים קשרים והסבר בעברית."}, {"title": "כללים ותרחישי בדיקה", "intro": "מה יקרה גם כשדברים לא הולכים כמתוכנן?", "example": "אירוע דיגיטלי פוגעני מוצג גם ללא שינוי בדופק; איכות מדידה נמוכה מגבילה מסקנות.", "questions": ["תרחיש הצלחה: נתוני התחלה, פעולה, תוצאה", "תרחיש כשל: מה השתבש ומה מוצג?", "תרחיש מידע חסר או מקרה חריג", "כלל פרטיות או בטיחות שחייב להישמר"], "prompt": "הצע תרחישי בדיקה עם נתוני דוגמה מדומים ותוצאה צפויה. חפש סתירות בין הדרישות, המסכים והמידע."}, {"title": "בינה מלאכותית במוצר", "intro": "האם עוזר חכם מוסיף ערך אמיתי?", "example": "עוזר להורה מסביר תובנות ומקורות; באבטיפוס התשובות מדומות, ללא אבחון.", "questions": ["האם צריך עוזר חכם? למה או למה לא?", "אם כן: מה המשתמש ישאל ומה יקבל?", "על איזה מידע מותר להסתמך?", "מה אסור לעוזר לעשות ומה קורה כשאין מידע?"], "prompt": "בחן אם בינה מלאכותית באמת נחוצה. אם כן, הגדר קלט, פלט, גבולות, תשובות מדומות ובדיקות. אם לא, הצע פתרון פשוט."}, {"title": "פרומפט לפיגמה", "intro": "איך הופכים את האפיון להדגמה אינטראקטיבית?", "example": "הפרומפט מתאר מסכים, ניווט, תרחישים, סנכרון מדומה ועוזר חכם מדומה.", "questions": ["שם המוצר, הבעיה והמשתמשים", "יכולות הגרסה הראשונה והמסכים", "זרימות, כללים, נתונים ותרחישים", "עיצוב, עברית מימין לשמאל ונגישות", "מה לא לחבר או לבנות; איך נבדוק הצלחה"], "prompt": "קרא את כל התשובות המאושרות בחוברת. כתוב פרומפט אחד מפורט ל-Figma Make לפי התבנית בעמוד הבא. אל תמציא דרישות; סמן שאלות פתוחות."}];
const key='idealab-workshop-v1';const fresh=()=>({name:'',project:'',page:-1,steps:stages.map(s=>({answers:s.questions.map(()=>''),approved:false,decision:'',open:''}))});let state=fresh();try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.steps?.length===11)state=saved}catch(e){};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer;function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',2600)}function save(){try{localStorage.setItem(key,JSON.stringify(state));$('saveStatus').textContent='נשמר בדפדפן זה'}catch(e){$('saveStatus').textContent='שמירה מקומית לא זמינה – הורידו גיבוי'}drawNav()}
function drawNav(){let n=state.steps.filter(s=>s.approved).length;$('progressText').textContent=`${n} מתוך 11 שלבים אושרו`;$('bar').style.width=n/11*100+'%';$('nav').innerHTML=stages.map((s,i)=>`<button data-page="${i}" class="${state.page===i?'active':''}"><span class="num ${state.steps[i].approved?'complete':''}">${state.steps[i].approved?'✓':i+1}</span>${esc(s.title)}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.page))}function go(p){state.page=p;save();render();window.scrollTo(0,0)}
const guide=`אתה המלווה המקצועי שלי בסדנת יזמות בחינוך ״מרעיון לאבטיפוס״. אני סטודנט שאינו בהכרח מגיע מעולם התוכנה. עבוד בעברית פשוטה. שאל שאלה אחת או שתיים בכל פעם, הסבר מונחים באמצעות דוגמאות, אל תענה במקומי ואל תמציא עובדות או נתונים. הפרד בין ראיות, השערות והחלטות. הצג חלופות והשלכות, בדוק סתירות עם החלטות קודמות, ובקש את אישורי לפני סיכום ומעבר. אל תכניס פרטים מזהים של תלמידים. אבטיפוס הוא הדגמה בנתונים מדומים, לא מוצר עובד. בסוף כל שלב תן סיכום שאפשר להעתיק לאתר תחת ״החלטות מאושרות״ ורשימת שאלות פתוחות. אל תתקדם לשלב הבא עד שאבקש.\nמסלול הסדנה:\n${stages.map((s,i)=>`${i+1}. ${s.title}: ${s.questions.join(' | ')}`).join('\n')}\nשם המיזם: `;
function initial(){return guide+(state.project||'טרם נקבע')+'\nהמתן עד שאשלח את התשובות וההנחיה לשלב שבו אני עובד.'}
function stageText(i){let s=stages[i],a=state.steps[i];return `שלב ${i+1}: ${s.title}\n${s.questions.map((q,j)=>q+'\n'+(a.answers[j]||'טרם נענה')).join('\n\n')}\nהחלטות מאושרות: ${a.approved?a.decision:'טרם אושר'}\nשאלות פתוחות: ${a.open||'לא צוינו'}`}
function prompt(i){return `אני עובד על המיזם ${state.project||'טרם נקבע'}.\nהקשר מאושר משלבים קודמים:\n${state.steps.map((a,j)=>j<i&&a.approved?`שלב ${j+1}: ${a.decision}\nשאלות פתוחות: ${a.open}`:'').filter(Boolean).join('\n')||'אין עדיין'}\n\n${stageText(i)}\n\nהנחיה: ${stages[i].prompt}\nשאל אותי לפני ניסוח מסקנות. בסיום הצע סיכום להחלטות ושאלות פתוחות, ללא מעבר לשלב הבא.`}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('הועתק ללוח')}catch(e){let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();toast(ok?'הועתק ללוח':'לא ניתן להעתיק – סמנו והעתיקו ידנית')}}function chat(){window.open('https://chatgpt.com/','_blank','noopener')}
function download(name,content,type='text/plain'){let u=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download('IdeaLab-backup.json',JSON.stringify(state,null,2),'application/json')}function restore(file){if(!file)return;file.text().then(t=>{let x=JSON.parse(t);if(!Array.isArray(x.steps)||x.steps.length!==11||!x.steps.every((s,i)=>Array.isArray(s.answers)&&s.answers.length===stages[i].questions.length&&s.answers.every(a=>typeof a==='string')&&typeof s.decision==='string'&&typeof s.open==='string'&&typeof s.approved==='boolean')||typeof x.name!=='string'||typeof x.project!=='string')throw Error();if(confirm('להחליף את העבודה הנוכחית בגיבוי?')){state=x;go(-1)}}).catch(()=>toast('קובץ גיבוי לא תקין'))}
function render(){drawNav();let i=state.page;if(i===-1){$('main').innerHTML=`<div class="kicker">ברוכים הבאים לסדנה</div><h1>יש לכם רעיון. עכשיו נהפוך אותו לאבטיפוס.</h1><p>לא צריך לדעת לתכנת כדי להתחיל. נעבוד ב-11 שלבים, במקביל למצגת, ונבנה ספר אפיון אישי ופרומפט לפיגמה.</p><div class="identity"><div><label for="name">שם הסטודנט</label><input id="name" value="${esc(state.name)}"></div><div><label for="project">שם המיזם</label><input id="project" value="${esc(state.project)}"></div></div><div class="example"><b>איך עובדים עם ChatGPT?</b><p>פתחו שיחה אישית אחת, העתיקו את הנחיית הפתיחה, ובכל שלב העתיקו את הפרומפט שהאתר יוצר. לאחר הדיון, החזירו לאתר את ההחלטות שלכם. אין סנכרון אוטומטי.</p></div><div class="actions"><button id="initCopy" class="primary">העתקת הנחיית פתיחה</button><button id="chat">פתיחת ChatGPT ↗</button><button id="start">לתחילת הסדנה ←</button></div><p class="notice">אין להזין מידע אמיתי או מזהה של תלמידים. העבודה נשמרת מקומית בלבד; הורידו גיבוי לפני מעבר למחשב אחר.</p><div class="sub"><h2>המשך עבודה וגיבוי</h2><div class="actions"><button id="resume">המשך לשלב הבא שלא אושר</button><button id="backup">הורדת גיבוי</button><button id="restore">טעינת גיבוי</button><input id="file" type="file" accept=".json" hidden style="display:none"></div></div>`;['name','project'].forEach(k=>$(k).oninput=e=>{state[k]=e.target.value;save()});$('initCopy').onclick=()=>copy(initial());$('chat').onclick=chat;$('start').onclick=()=>go(0);$('resume').onclick=()=>{let j=state.steps.findIndex(s=>!s.approved);go(j<0?11:j)};$('backup').onclick=backup;$('restore').onclick=()=>$('file').click();$('file').onchange=e=>restore(e.target.files[0]);return}if(i===11){renderSummary();return}let s=stages[i],a=state.steps[i];$('main').innerHTML=`<div class="stephead"><span class="kicker">שלב ${i+1} / 11 · שקף ${i+4} · עמוד ${i+2} בחוברת</span><span class="tag" id="approval">${a.approved?'✓ מאושר':'בעבודה'}</span></div><h1>${esc(s.title)}</h1><p>${esc(s.intro)}</p><div class="example"><b>דוגמה מהדופק החברתי</b><p>${esc(s.example)}</p></div><h2>עכשיו תורכם</h2><div class="fields">${s.questions.map((q,j)=>`<div><label for="q${j}">${esc(q)}</label><textarea id="q${j}" placeholder="כתבו במילים שלכם...">${esc(a.answers[j])}</textarea></div>`).join('')}</div><div class="sub"><h2>התייעצות עם הבינה המלאכותית</h2><p>${esc(s.prompt)}</p><div class="actions"><button class="primary" id="copyStage">העתקת פרומפט מותאם לשלב</button><button id="chat">פתיחת ChatGPT ↗</button></div><p class="help">הדביקו בשיחה האישית שכבר פתחתם. קראו את המשוב, שאלו שאלות והחליטו בעצמכם.</p></div><div class="sub"><h2>סיכום והחלטות</h2><label for="decision">החלטות מאושרות לאחר הדיון</label><textarea id="decision" placeholder="מה החלטתם בפועל?">${esc(a.decision)}</textarea><label for="open">שאלות פתוחות / מה נדרש לבדוק</label><textarea id="open">${esc(a.open)}</textarea><label class="check"><input type="checkbox" id="approved" ${a.approved?'checked':''}> בדקתי שהתשובות משקפות את ההחלטות שלי, וסימנתי מה נשאר פתוח.</label><div class="actions"><button id="next" class="primary">${i===10?'לספר האפיון':'לשלב הבא'} ←</button><button id="prev">→ ${i===0?'לדף הפתיחה':'לשלב הקודם'}</button></div><p class="help">ניתן להתקדם גם ללא אישור; שלב שלא אושר יישאר מסומן כבעבודה. שינוי בתשובות מבטל את אישור השלב ודורש בדיקה חוזרת.</p></div>`;function update(){a.approved=false;$('approved').checked=false;$('approval').textContent='בעבודה';save()}s.questions.forEach((q,j)=>$('q'+j).oninput=e=>{a.answers[j]=e.target.value;if(i===0&&j===0)state.project=e.target.value;update()});['decision','open'].forEach(k=>$(k).oninput=e=>{a[k]=e.target.value;update()});$('approved').onchange=e=>{if(e.target.checked&&(!a.decision.trim()||a.answers.some(x=>!x.trim()))){e.target.checked=false;toast('מלאו את כל השאלות (אפשר לציין שטרם ידוע) ואת ההחלטות');return}a.approved=e.target.checked;$('approval').textContent=a.approved?'✓ מאושר':'בעבודה';save()};$('copyStage').onclick=()=>copy(prompt(i));$('chat').onclick=chat;$('next').onclick=()=>go(i+1);$('prev').onclick=()=>go(i-1)}
function finalPrompt(){return `כתוב פרומפט אחד מפורט ל-Figma Make לבניית אבטיפוס אינטראקטיבי למיזם ${state.project||'טרם נקבע'}. הסתמך רק על ההחלטות המאושרות הבאות. סמן מידע חסר כשאלה פתוחה, אל תמציא דרישות.\n${state.steps.map((a,i)=>a.approved?`\n${stages[i].title}: ${a.decision}\nשאלות פתוחות: ${a.open||'לא צוינו'}`:'').join('\n')}\nהפרומפט יכלול: בעיה ומשתמשים, ערך ותכולת הגרסה הראשונה, מסכים ותוכן וכפתורים ויעדי ניווט, זרימה וחזרה ומצבי כשל, נתונים מדומים ושדות וקשרים, כללי פעולה ותרחישי בדיקה ופרטיות, עוזר חכם מדומה רק אם אושר, עיצוב בעברית מימין לשמאל ונגישות, מה מחוץ לתכולה ובדיקות הצלחה. אין לחבר שירותים חיצוניים או מידע אמיתי. אין להציג הדמיה כיכולת עובדת. בדוק שכל כפתור מוביל ליעד ושיש דרך חזרה. אם חסרה החלטה מהותית שאל אותי לפני יצירת הפרומפט הסופי.`}
function book(){return `# מרעיון לאבטיפוס – ספר אפיון\nשם: ${state.name}\nמיזם: ${state.project}\n\n`+stages.map((s,i)=>`## ${i+1}. ${s.title} – ${state.steps[i].approved?'מאושר':'טיוטה'}\n${stageText(i)}\n`).join('\n')}
function renderSummary(){let n=state.steps.filter(s=>s.approved).length;$('main').innerHTML=`<div class="kicker">תוצר הסדנה</div><h1>ספר האפיון שלי</h1><p>${esc(state.project||'מיזם ללא שם')} · ${esc(state.name||'ללא שם')} · ${n}/11 שלבים מאושרים</p>${n<11?'<p class="notice">טרם אושרו כל השלבים. אפשר להוריד טיוטה, אך הפרומפט לפיגמה יתבסס רק על החלטות מאושרות.</p>':''}<div class="actions"><button class="primary" id="export">הורדת ספר האפיון</button><button id="backup">הורדת גיבוי</button><button id="print">הדפסה / PDF</button></div>${stages.map((s,i)=>`<div class="sub"><div class="stephead"><b>${i+1}. ${esc(s.title)}</b><span class="tag">${state.steps[i].approved?'✓ מאושר':'טיוטה'}</span></div><pre>${esc(stageText(i))}</pre></div>`).join('')}<div class="sub"><h2>פרומפט ליצירת הפרומפט הסופי לפיגמה</h2><p>העתיקו לשיחת ChatGPT שלכם. לאחר קבלת הפרומפט הסופי ובדיקתו, הדביקו אותו ב-Figma Make.</p><textarea id="fp" readonly rows="10">${esc(finalPrompt())}</textarea><div class="actions"><button class="primary" id="copyFinal">העתקה ל-ChatGPT</button><button id="chat">פתיחת ChatGPT ↗</button><button id="figma">פתיחת Figma ↗</button></div><p>לאחר יצירת האבטיפוס: תנו לעמית לבצע פעולה בלי להסביר לו. תעדו קושי, תקנו את האפיון ושפרו את הפרומפט.</p></div>`;$('export').onclick=()=>download('IdeaLab-specification.md',book());$('backup').onclick=backup;$('print').onclick=()=>window.print();$('copyFinal').onclick=()=>copy(finalPrompt());$('chat').onclick=chat;$('figma').onclick=()=>window.open('https://www.figma.com/','_blank','noopener')}
$('home').onclick=()=>go(-1);$('summary').onclick=()=>go(11);if(!Number.isInteger(state.page)||state.page< -1||state.page>11)state.page=-1;render();
</script></body></html>
